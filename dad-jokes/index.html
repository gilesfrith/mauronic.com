<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dad Jokes — Mauronic</title>
  <meta name="description" content="Twenty dad jokes, each with a five-second video punchline.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../site.css">
  <style>
    .intro { color: var(--muted); max-width: 520px; margin: 14px auto 0; line-height: 1.5; }
    .grid {
      width: min(1100px, 100%);
      margin-top: 36px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 18px;
    }
    .joke {
      position: relative;
      aspect-ratio: 9 / 16;
      border: 2px solid var(--gold);
      border-radius: 12px;
      overflow: hidden;
      background: #17171b;
      text-align: left;
      scroll-margin: 16px;
    }
    .joke img, .joke video {
      position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block;
    }
    .face, .done {
      position: absolute; inset: 0;
      display: flex; flex-direction: column; justify-content: flex-end;
      padding: 18px; text-align: left; cursor: pointer;
    }
    .face { background: linear-gradient(to top, rgba(13,13,15,0.95) 35%, rgba(13,13,15,0.15) 80%, transparent); }
    .face:focus-visible, .done button:focus-visible { outline: 3px solid var(--yellow); outline-offset: -3px; }
    .num { font-family: "Anton", Impact, sans-serif; color: var(--gold); font-size: 1.1rem; letter-spacing: 0.06em; }
    .setup { font-weight: 600; font-size: 1.15rem; line-height: 1.3; margin-top: 6px; }
    .play {
      margin-top: 14px; align-self: flex-start;
      display: inline-flex; align-items: center; gap: 8px;
      padding: 8px 14px; border-radius: 999px;
      background: var(--gold); color: #111; font-weight: 600; font-size: 0.85rem;
    }
    .play::before { content: ""; border-left: 9px solid #111; border-top: 6px solid transparent; border-bottom: 6px solid transparent; }
    .done { background: linear-gradient(to top, rgba(13,13,15,0.97) 50%, rgba(13,13,15,0.55) 85%, rgba(13,13,15,0.3)); }
    .done .setup { font-size: 1rem; color: var(--muted); }
    .answer {
      margin-top: 10px;
      font-family: "Anton", Impact, sans-serif; font-size: 1.6rem; line-height: 1.1;
      text-transform: uppercase; color: var(--ink);
    }
    .note { margin-top: 8px; font-size: 0.8rem; color: var(--muted); }
    .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; }
    .actions button {
      padding: 10px 16px; border-radius: 999px; font-weight: 600; font-size: 0.9rem; cursor: pointer;
    }
    .actions .again { background: transparent; border: 1.5px solid var(--gold); color: var(--ink); }
    .actions .next { background: var(--gold); color: #111; }
    .actions .next:hover { background: var(--yellow); }
    .joke.playing .face { display: none; }
  </style>
</head>
<body>
  <nav class="nav"><a href="../">Home</a><a href="./" aria-current="page">Dad Jokes</a><a href="../poop/">Poop</a></nav>
  <div class="stripes" aria-hidden="true"><span></span><span></span><span></span></div>
  <p class="brand">Mauronic.com</p>
  <h1>Dad Jokes</h1>
  <p class="intro">Twenty groaners. Read the setup, then tap for the punchline. When it ends, tap again for the next one.</p>
  <main class="grid" id="grid"></main>
  <footer>&copy; <span id="y">2026</span> Mauronic</footer>

  <script>
    document.getElementById("y").textContent = new Date().getFullYear();
    const grid = document.getElementById("grid");

    function esc(s) { const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }

    const cards = [];
    const motion = matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth";
    const label = i => "#" + String(i + 1).padStart(2, "0");

    function play(i) {
      const { card, joke } = cards[i];
      grid.querySelectorAll("video").forEach(v => { if (!card.contains(v)) v.pause(); });
      card.querySelector(".done")?.remove();
      card.classList.add("playing");
      let v = card.querySelector("video");
      if (v) {
        v.currentTime = 0;
      } else {
        v = document.createElement("video");
        v.src = "videos/" + joke.id + ".mp4";
        v.playsInline = true;
        v.preload = "auto";
        v.setAttribute("aria-label", joke.punchline);
        v.addEventListener("ended", () => finish(i));
        v.addEventListener("error", () => { v.remove(); finish(i, "Video coming soon"); });
        v.addEventListener("click", () => (v.paused ? v.play() : v.pause()));
        card.appendChild(v);
      }
      v.play().catch(() => {});
    }

    function finish(i, note) {
      const { card, joke } = cards[i];
      if (card.querySelector(".done")) return;
      const last = i === cards.length - 1;
      const d = document.createElement("div");
      d.className = "done";
      d.innerHTML =
        '<span class="num">' + label(i) + '</span>' +
        '<p class="setup">' + esc(joke.setup) + '</p>' +
        '<p class="answer">' + esc(joke.punchline) + '</p>' +
        (note ? '<p class="note">' + esc(note) + '</p>' : '') +
        '<div class="actions">' +
          (note ? '' : '<button type="button" class="again">Watch again</button>') +
          '<button type="button" class="next">' + (last ? "Back to the top ↑" : "Next joke ↓") + '</button>' +
        '</div>';
      d.addEventListener("click", e => {
        if (e.target.closest(".again")) play(i);
        else next(i);
      });
      card.appendChild(d);
      d.querySelector(".next").focus({ preventScroll: true });
    }

    function next(i) {
      if (i === cards.length - 1) {
        window.scrollTo({ top: 0, behavior: motion });
        return;
      }
      cards[i + 1].card.scrollIntoView({ behavior: motion, block: "center" });
      play(i + 1);
    }

    fetch("jokes.json")
      .then(r => r.json())
      .then(jokes => {
        jokes.forEach((joke, i) => {
          const card = document.createElement("article");
          card.className = "joke";
          card.innerHTML =
            '<img src="videos/' + joke.id + '.jpg" alt="" loading="lazy" onerror="this.remove()">' +
            '<button type="button" class="face">' +
            '<span class="num">' + label(i) + '</span>' +
            '<span class="setup">' + esc(joke.setup) + '</span>' +
            '<span class="play">Punchline</span></button>';
          const face = card.querySelector(".face");
          face.setAttribute("aria-label", joke.setup + " Play the punchline");
          face.addEventListener("click", () => play(i));
          cards.push({ card, joke });
          grid.appendChild(card);
        });
      });
  </script>
</body>
</html>
