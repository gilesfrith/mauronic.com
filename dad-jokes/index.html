<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dad Jokes — Mauronic</title>
  <meta name="description" content="Twenty dad jokes, each with a five-second video punchline.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../site.css">
  <style>
    .intro { color: var(--muted); max-width: 520px; margin: 14px auto 0; line-height: 1.5; }
    .grid {
      width: min(1100px, 100%);
      margin-top: 36px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 18px;
    }
    .joke {
      position: relative;
      aspect-ratio: 9 / 16;
      border: 2px solid var(--gold);
      border-radius: 12px;
      overflow: hidden;
      background: #17171b;
      cursor: pointer;
      text-align: left;
    }
    .joke:focus-visible { outline: 3px solid var(--yellow); outline-offset: 3px; }
    .joke img, .joke video {
      position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block;
    }
    .joke .face {
      position: absolute; inset: 0;
      display: flex; flex-direction: column; justify-content: flex-end;
      padding: 18px;
      background: linear-gradient(to top, rgba(13,13,15,0.95) 35%, rgba(13,13,15,0.15) 80%, transparent);
    }
    .num { font-family: "Anton", Impact, sans-serif; color: var(--gold); font-size: 1.1rem; letter-spacing: 0.06em; }
    .setup { font-weight: 600; font-size: 1.15rem; line-height: 1.3; margin-top: 6px; }
    .play {
      margin-top: 14px; align-self: flex-start;
      display: inline-flex; align-items: center; gap: 8px;
      padding: 8px 14px; border-radius: 999px;
      background: var(--gold); color: #111; font-weight: 600; font-size: 0.85rem;
    }
    .play::before { content: ""; border-left: 9px solid #111; border-top: 6px solid transparent; border-bottom: 6px solid transparent; }
    .punch {
      position: absolute; left: 0; right: 0; bottom: 0;
      padding: 16px 18px 18px;
      background: linear-gradient(to top, rgba(13,13,15,0.95), rgba(13,13,15,0.6) 70%, transparent);
      font-family: "Anton", Impact, sans-serif; font-size: 1.5rem; line-height: 1.1;
      text-transform: uppercase; color: var(--ink);
    }
    .punch small { display: block; font-family: "Inter", sans-serif; font-size: 0.75rem; text-transform: none; color: var(--muted); margin-top: 8px; }
    .joke.playing .face { display: none; }
  </style>
</head>
<body>
  <nav class="nav"><a href="../">Home</a><a href="./" aria-current="page">Dad Jokes</a></nav>
  <div class="stripes" aria-hidden="true"><span></span><span></span><span></span></div>
  <p class="brand">Mauronic.com</p>
  <h1>Dad Jokes</h1>
  <p class="intro">Twenty groaners. Read the setup, then click for the punchline.</p>
  <main class="grid" id="grid"></main>
  <footer>&copy; <span id="y">2026</span> Mauronic</footer>

  <script>
    document.getElementById("y").textContent = new Date().getFullYear();
    const grid = document.getElementById("grid");

    function esc(s) { const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }

    function showPunchline(card, joke, note) {
      if (card.querySelector(".punch")) return;
      const p = document.createElement("div");
      p.className = "punch";
      p.innerHTML = esc(joke.punchline) + (note ? "<small>" + esc(note) + "</small>" : "");
      card.appendChild(p);
    }

    function play(card, joke) {
      grid.querySelectorAll("video").forEach(v => { if (!card.contains(v)) v.pause(); });
      const existing = card.querySelector("video");
      if (existing) {
        card.querySelector(".punch")?.remove();
        existing.currentTime = 0;
        existing.play();
        return;
      }
      card.classList.add("playing");
      const v = document.createElement("video");
      v.src = "videos/" + joke.id + ".mp4";
      v.playsInline = true;
      v.autoplay = true;
      v.setAttribute("aria-label", joke.punchline);
      v.addEventListener("ended", () => showPunchline(card, joke, "Click to watch again"));
      v.addEventListener("error", () => {
        v.remove();
        showPunchline(card, joke, "Video coming soon");
      });
      card.appendChild(v);
    }

    fetch("jokes.json")
      .then(r => r.json())
      .then(jokes => {
        jokes.forEach((joke, i) => {
          const card = document.createElement("button");
          card.className = "joke";
          card.type = "button";
          card.setAttribute("aria-label", joke.setup + " Play the punchline");
          card.innerHTML =
            '<img src="videos/' + joke.id + '.jpg" alt="" loading="lazy" onerror="this.remove()">' +
            '<div class="face"><span class="num">#' + String(i + 1).padStart(2, "0") + '</span>' +
            '<span class="setup">' + esc(joke.setup) + '</span>' +
            '<span class="play">Punchline</span></div>';
          card.addEventListener("click", () => play(card, joke));
          grid.appendChild(card);
        });
      });
  </script>
</body>
</html>
